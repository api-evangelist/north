name: North
description: >-
  North (formerly Thalmic Labs) was a wearable-computing hardware company founded
  in 2012 in Kitchener, Ontario by University of Waterloo graduates Stephen Lake,
  Matthew Bailey, and Aaron Grant. It first shipped the Myo gesture-control armband,
  which read electrical muscle activity to wirelessly control computers and other
  devices, and later pivoted to Focals, consumer smart glasses with a heads-up
  display. A Y Combinator Winter 2013 company that raised over $140M, North was
  acquired by Google in January 2020 and wound down; its products and consumer-facing
  website (bynorth.com) were discontinued. This profile is retained as a network
  record. North published no public API, developer portal, or SDKs, so there is no
  API surface to enrich.
